spring.application.name=taskmanager
server.port=8080

# ===== PostgreSQL Datasource Configuration =====
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.username=taskadmin
spring.datasource.password=securepassword
spring.datasource.driverClassName=org.postgresql.Driver

# ===== JPA/Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console is no longer needed as we switched to PostgreSQL
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- Profile Grouping for Redis (optional, but can be kept) ---
spring.profiles.group.redis=redis

# General Redis properties like host/port will now be in application-redis.properties
# spring.redis.host=localhost
# spring.redis.port=6379
# spring.redis.password= # Uncomment and set if your Redis server requires a password

# --- Profile Grouping for RabbitMQ ---
spring.profiles.group.rabbitmq=rabbitmq
