spring.application.name=taskmanager
server.port=8080

# ===== H2 Datasource Configuration =====
# URL подключения к H2. 'mem:taskmanagerdb' означает in-memory базу с именем 'taskmanagerdb'
# DB_CLOSE_DELAY=-1 означает, что база данных не будет удаляться, пока JVM работает (полезно для H2 Console)
spring.datasource.url=jdbc:h2:mem:taskmanagerdb;DB_CLOSE_DELAY=-1
# Драйвер H2
spring.datasource.driverClassName=org.h2.Driver
# Имя пользователя для H2 (по умолчанию)
spring.datasource.username=sa
# Пароль для H2 (по умолчанию пустой)
spring.datasource.password=

# ===== JPA/Hibernate Configuration =====
# ddl-auto: create-drop -> таблицы будут создаваться при запуске и удаляться при остановке.
# Хорошо для разработки. Другие варианты: update, validate, none.
spring.jpa.hibernate.ddl-auto=create-drop
# Показывать SQL запросы в консоли (полезно для отладки)
spring.jpa.show-sql=true
# Форматировать SQL запросы для лучшей читаемости
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 Console Configuration (очень полезно для просмотра базы данных в браузере) =====
# Включить H2 Console
spring.h2.console.enabled=true
# Путь, по которому будет доступна H2 Console (например, http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console
