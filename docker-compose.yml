services:
  h2-db:
    image: oscarfonts/h2:latest # Образ H2 базы данных
    container_name: taskmanager-h2-db
    ports:
      - "8081:81"  # Веб-консоль H2 (доступна на хосте по порту 8081)
      - "1521:1521" # TCP порт для подключения к БД H2 (доступен на хосте по порту 1521)
    volumes:
      - h2_data:/opt/h2-data # Маппинг именованного тома Docker для сохранения данных H2 между перезапусками
    environment:
      # -ifNotExists: создает БД, если она не существует при старте сервера
      # -webAllowOthers / -tcpAllowOthers: разрешают подключения к веб-консоли и по TCP с других хостов (внутри Docker сети)
      - H2_OPTIONS=-webAllowOthers -tcpAllowOthers -ifNotExists
    networks:
      - taskmanager-network

  app: # Сервис Spring Boot приложения
    build: . # Сборка из Dockerfile в текущей директории
    container_name: taskmanager-app
    restart: on-failure # Политика перезапуска контейнера в случае сбоя
    ports:
      - "8080:8080" # Маппинг порта приложения (8080 в контейнере на 8080 на хосте)
    depends_on:
      - h2-db # Приложение запустится только после успешного старта сервиса h2-db
    environment:
      # URL для подключения к H2. 'h2-db' - имя сервиса H2 в Docker сети, '1521' - порт H2.
      # 'taskmanagerdb' - имя файла БД (сервер H2 ищет его в /opt/h2-data/ внутри своего контейнера).
      - SPRING_DATASOURCE_URL=jdbc:h2:tcp://h2-db:1521/taskmanagerdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_USERNAME=sa # Имя пользователя для H2
      - SPRING_DATASOURCE_PASSWORD= # Пароль для H2 (пустой по умолчанию)
      # ddl-auto=update: Hibernate будет пытаться обновить схему БД в соответствии с сущностями JPA.
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # Диалект Hibernate для H2. Spring Boot обычно определяет его автоматически для H2, но явное указание не повредит.
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      # Включает H2 консоль, доступную через само Spring Boot приложение (обычно по /h2-console).
      # Полезно для быстрой проверки схемы или данных через порт приложения.
      - SPRING_H2_CONSOLE_ENABLED=true
    networks:
      - taskmanager-network

volumes:
  h2_data: # Определяет именованный том 'h2_data' для персистентности данных H2

networks:
  taskmanager-network: # Определяет пользовательскую bridge-сеть для изоляции и связи контейнеров
    driver: bridge 